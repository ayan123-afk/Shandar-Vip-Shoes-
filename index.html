<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shandar VIP Shoes — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 193, 7, 0.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255, 87, 34, 0.10), transparent 30%),
        #080808;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: min(1100px, 92%);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffd54a, #b8860b);
      color: #080808;
      font-size: 38px;
      box-shadow: 0 0 45px rgba(255, 193, 7, .25);
      animation: float 3s ease-in-out infinite;
    }

    .tag {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(255, 213, 74, .35);
      border-radius: 50px;
      color: #ffd54a;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 88px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(90deg, #fff, #ffd54a, #fff);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }

    .subtitle {
      margin: 22px auto 0;
      max-width: 650px;
      color: #bdbdbd;
      font-size: 17px;
      line-height: 1.7;
    }

    .divider {
      width: 90px;
      height: 3px;
      margin: 30px auto;
      background: linear-gradient(90deg, transparent, #ffd54a, transparent);
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .time {
      min-width: 105px;
      padding: 20px 15px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(15px);
    }

    .time strong {
      display: block;
      font-size: 30px;
      color: #ffd54a;
    }

    .time span {
      font-size: 11px;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .btn {
      padding: 14px 25px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      transition: .3s;
    }

    .primary {
      background: #ffd54a;
      color: #080808;
      box-shadow: 0 10px 35px rgba(255, 193, 7, .18);
    }

    .secondary {
      color: #fff;
      border: 1px solid #333;
      background: rgba(255,255,255,.04);
    }

    .btn:hover {
      transform: translateY(-4px);
    }

    footer {
      margin-top: 55px;
      color: #666;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 213, 74, .08);
      pointer-events: none;
    }

    .c1 {
      width: 500px;
      height: 500px;
      top: -250px;
      left: -250px;
    }

    .c2 {
      width: 650px;
      height: 650px;
      bottom: -350px;
      right: -300px;
    }

    @keyframes shine {
      0% { background-position: 0%; }
      100% { background-position: 200%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media(max-width: 600px) {
      .time {
        min-width: 75px;
        padding: 15px 10px;
      }

      .time strong {
        font-size: 24px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="circle c1"></div>
  <div class="circle c2"></div>

  <main class="container">

    <div class="logo">VIP</div>

    <div class="tag">Something Premium Is Coming</div>

    <h1>Shandar VIP Shoes</h1>

    <p class="subtitle">
      We're crafting something special for you.
      Our new premium shoe collection and online store
      will be launching very soon.
    </p>

    <div class="divider"></div>

    <div class="countdown">
      <div class="time">
        <strong id="days">00</strong>
        <span>Days</span>
      </div>

      <div class="time">
        <strong id="hours">00</strong>
        <span>Hours</span>
      </div>

      <div class="time">
        <strong id="minutes">00</strong>
        <span>Minutes</span>
      </div>

      <div class="time">
        <strong id="seconds">00</strong>
        <span>Seconds</span>
      </div>
    </div>

    <div class="buttons">
      <a href="https://wa.me/923000000000" class="btn primary">
        Contact Us
      </a>

      <a href="#" class="btn secondary">
        Follow Us
      </a>
    </div>

    <footer>
      © 2026 Shandar VIP Shoes — All Rights Reserved
    </footer>

  </main>

  <script>
    // Change this date to your actual launch date
    const launchDate = new Date("2026-12-01T00:00:00").getTime();

    function updateCountdown() {
      const now = Date.now();
      const distance = launchDate - now;

      if (distance <= 0) {
        document.querySelector(".countdown").innerHTML =
          "<h2 style='color:#ffd54a'>WE ARE LIVE!</h2>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
      );
      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) / (1000 * 60)
      );
      const seconds = Math.floor(
        (distance % (1000 * 60)) / 1000
      );

      document.getElementById("days").textContent =
        String(days).padStart(2, "0");

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
