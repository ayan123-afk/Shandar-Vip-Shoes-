<!DOCTYPE html>
<html>
<head>
<title>FINAL TEST</title>
<style>
body{font-family:Arial;background:#000;color:#0f0;padding:2rem;font-size:1.1rem;line-height:1.8}
#out{margin-top:1rem;padding:1rem;background:#111;border:2px solid #0f0;border-radius:8px;white-space:pre-wrap;font-family:monospace;min-height:300px}
</style>
</head>
<body>
<h1>🔬 FINAL TEST</h1>
<div id="out">Starting... wait 5 seconds...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const out = document.getElementById('out');
function log(s) { out.innerHTML += '\n' + s; }

out.innerHTML = '';

firebase.initializeApp({
  apiKey: "AIzaSyCsbAdGKmEDA5R31dPuZXCq43332ZpE05A",
  authDomain: "shandar-vip.firebaseapp.com",
  projectId: "shandar-vip",
  storageBucket: "shandar-vip.firebasestorage.app",
  messagingSenderId: "217113477423",
  appId: "1:217113477423:web:f64fd0ff63c06d504961da"
});

log('1. Firebase loaded ✅');

const db = firebase.firestore();
log('2. Firestore ready ✅');

log('3. Testing HTTP connection...');
fetch("https://firestore.googleapis.com/v1/projects/shandar-vip/databases/(default)/documents/products?pageSize=1")
  .then(r => {
    log('   HTTP Status: ' + r.status);
    if (r.status === 200) log('   ✅ Database exists!');
    else if (r.status === 404) log('   ❌ DATABASE DOES NOT EXIST!');
    else if (r.status === 403) log('   ❌ Rules block kar rahe hain');
    return r.text();
  })
  .then(t => {
    log('   Response: ' + t.substring(0, 200));
    log('');
    log('4. Testing SDK WRITE...');
    return Promise.race([
      db.collection('products').add({name:"TEST_" + Date.now(), price: 5000, category: "Sneakers", image: "https://via.placeholder.com/300", description: "test", createdAt: firebase.firestore.FieldValue.serverTimestamp()}),
      new Promise((_,rej) => setTimeout(() => rej(new Error("TIMEOUT_15s")), 15000))
    ]);
  })
  .then(r => {
    log('   ✅✅✅ WRITE OK! ID: ' + r.id);
    log('');
    log('🎉🎉🎉 SAB KAAM KAR RAHA HAI! 🎉🎉🎉');
    log('');
    log('Ab admin panel bhi chalega.');
    log('Product add karein, order aayenge, sab chalega.');
    return db.collection('products').doc(r.id).delete();
  })
  .catch(e => {
    log('   ❌ FAILED');
    log('   Code: ' + (e.code || 'none'));
    log('   Message: ' + e.message);
    log('');
    log('👉 PROBLEM:');
    if (e.message && e.message.includes('TIMEOUT')) log('   Network ya Firestore block');
    else if (e.code === 'permission-denied') log('   Rules allow nahi kar rahe');
    else if (e.code === 'not-found') log('   Database exist nahi karta');
  });
</script>
</body>
</html>
