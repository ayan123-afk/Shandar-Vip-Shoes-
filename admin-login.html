<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · Shandar VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="config.js"></script>
<style>
:root{--bg:#05070f;--bg-2:#0a0f1e;--bg-card:#0f172a;--bg-elev:#131c35;--blue:#3b82f6;--blue-light:#60a5fa;--blue-glow:rgba(59,130,246,0.35);--blue-deep:#1e40af;--accent:#06b6d4;--danger:#ef4444;--text:#e2e8f0;--text-muted:#94a3b8;--border:#1e293b;--border-hi:#334155;--transition:0.3s cubic-bezier(0.4,0,0.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-30%;right:-15%;width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,0.25) 0%,transparent 70%);border-radius:50%}
body::after{content:'';position:absolute;bottom:-30%;left:-15%;width:500px;height:500px;background:radial-gradient(circle,rgba(6,182,212,0.18) 0%,transparent 70%);border-radius:50%}
.login-card{position:relative;z-index:1;width:100%;max-width:440px;background:var(--bg-card);border:1px solid var(--border-hi);border-radius:24px;padding:2.5rem;box-shadow:0 30px 80px rgba(0,0,0,0.7),0 0 60px var(--blue-glow);animation:slideUp 0.6s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.login-logo{display:flex;align-items:center;justify-content:center;gap:0.75rem;margin-bottom:2rem}
.login-logo img{width:60px;height:60px;border-radius:16px;object-fit:cover;box-shadow:0 10px 30px var(--blue-glow);border:1px solid var(--border-hi)}
.login-logo-text{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#fff 30%,var(--blue-light) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-header{text-align:center;margin-bottom:2rem}
.login-header h1{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;margin-bottom:0.5rem}
.login-header p{color:var(--text-muted);font-size:0.9rem}
.form-group{margin-bottom:1.2rem}
.form-group label{display:flex;align-items:center;gap:0.5rem;font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:0.4rem}
.form-group label i{color:var(--blue-light);width:16px}
.form-group input{width:100%;padding:0.9rem 1rem;background:var(--bg-elev);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:0.92rem;outline:none;transition:all var(--transition)}
.form-group input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-glow)}
.login-btn{width:100%;padding:1rem;border-radius:14px;background:linear-gradient(135deg,var(--blue) 0%,var(--accent) 100%);color:#fff;font-weight:800;font-size:0.92rem;letter-spacing:1px;text-transform:uppercase;transition:all var(--transition);margin-top:0.5rem;display:flex;align-items:center;justify-content:center;gap:0.6rem;font-family:inherit;border:none;cursor:pointer}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 15px 35px var(--blue-glow)}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.login-footer{text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--text-muted)}
.login-footer a{color:var(--blue-light);font-weight:600;cursor:pointer}
.login-footer a:hover{text-decoration:underline}
.error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;padding:0.75rem 1rem;border-radius:10px;font-size:0.85rem;margin-bottom:1rem;display:none;align-items:center;gap:0.5rem}
.error-msg.show{display:flex}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <img src="https://i.postimg.cc/fknXYM5L/4bdb1cf1-6c9d-47ab-89e6-54df8247d1b6.png" alt="Shandar VIP">
    <div class="login-logo-text">Shandar VIP</div>
  </div>
  <div class="login-header"><h1>Admin Access</h1><p>Secure login for authorized personnel</p></div>
  <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span id="errorText"></span></div>
  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="form-group"><label><i class="fas fa-envelope"></i> Admin Email</label><input type="email" id="email" placeholder="admin@shandarvip.com" required autocomplete="email"></div>
    <div class="form-group"><label><i class="fas fa-lock"></i> Password</label><input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"></div>
    <button type="submit" class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login to Dashboard</button>
  </form>
  <div class="login-footer"><a onclick="window.location.href='/'"><i class="fas fa-arrow-left"></i> Back to Store</a></div>
</div>
<script>
auth.onAuthStateChanged(user=>{if(user)window.location.href='/admin';});
async function handleLogin(e){e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');
  const errEl=document.getElementById('errorMsg');
  const errText=document.getElementById('errorText');
  errEl.classList.remove('show');
  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Authenticating...';
  try{
    await auth.signInWithEmailAndPassword(email,password);
    Swal.fire({icon:'success',title:'Welcome Back!',text:'Redirecting...',timer:1200,showConfirmButton:false,background:'#0f172a',color:'#e2e8f0'});
    setTimeout(()=>window.location.href='/admin',1200);
  }catch(err){
    let msg='Login failed. Please check your credentials.';
    if(err.code==='auth/user-not-found')msg='No admin account found with this email.';
    else if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')msg='Incorrect password. Try again.';
    else if(err.code==='auth/invalid-email')msg='Invalid email format.';
    else if(err.code==='auth/too-many-requests')msg='Too many attempts. Try later.';
    errText.textContent=msg;
    errEl.classList.add('show');
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
  }
  return false;
}
</script>
</body>
</html>
